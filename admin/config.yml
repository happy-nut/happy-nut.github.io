# 모바일 글쓰기 (Sveltia CMS). /admin 에서 GitHub 토큰으로 로그인한다.
# 저장하면 main 에 바로 커밋되고, pages-deploy 워크플로가 1~2분 뒤 사이트에 배포한다.
backend:
  name: github
  repo: happy-nut/happy-nut.github.io
  branch: main
  commit_messages:
    create: "new post {{slug}}"
    update: "update {{slug}}"
    delete: "delete {{slug}}"
    uploadMedia: "upload {{path}}"
    deleteMedia: "delete {{path}}"

site_url: https://happy-nut.github.io
display_url: https://happy-nut.github.io
logo_url: /assets/img/favicons/android-chrome-192x192.png

media_folder: assets/img/posts
public_folder: /assets/img/posts

# 빈 요약·대표 이미지를 '' 로 남기면 Chirpy 가 빈 값을 있는 값으로 보고 깨진 이미지를 그린다
output:
  omit_empty_optional_fields: true

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: _posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    sortable_fields: [date, title]
    summary: "{{title}} · {{date | date('YYYY.MM.DD')}}"
    fields:
      - { name: title, label: 제목, widget: string }
      - name: date
        label: 날짜
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        default: "{{now}}"
      - name: categories
        label: 카테고리
        widget: list
        hint: "영문 소문자 kebab-case (예: engineering, kotlin)"
        field: { name: category, label: 카테고리, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "영문 소문자와 - 만 쓸 수 있어요"] }
      - name: tags
        label: 태그
        widget: list
        required: false
        field: { name: tag, label: 태그, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "영문 소문자와 - 만 쓸 수 있어요"] }
      - { name: description, label: 요약, widget: text, required: false }
      - { name: image, label: 대표 이미지, widget: image, required: false }
      - { name: mermaid, label: Mermaid, widget: boolean, default: false }
      - { name: math, label: 수식, widget: boolean, default: false }
      - { name: published, label: 공개, widget: boolean, default: true, hint: "끄면 저장만 하고 사이트에는 올리지 않아요 (초안)" }
      - { name: body, label: 본문, widget: markdown }

  - name: diary
    label: 일기 (비공개)
    label_singular: 일기
    folder: koongya
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    sortable_fields: [date, title]
    summary: "{{title}} · {{date | date('YYYY.MM.DD')}}"
    fields:
      - { name: title, label: 제목, widget: string }
      - name: date
        label: 날짜
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        default: "{{now}}"
      - { name: categories, label: 카테고리, widget: list, required: false }
      - { name: tags, label: 태그, widget: list, default: [쿵야] }
      - { name: mermaid, label: Mermaid, widget: boolean, default: false }
      - { name: math, label: 수식, widget: boolean, default: false }
      - { name: body, label: 본문, widget: markdown }
